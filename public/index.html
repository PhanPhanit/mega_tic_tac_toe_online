<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mega Tic Tac Toe Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#eef4ff;font:16px system-ui;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:24px 14px}h1{text-align:center;font-size:clamp(27px,5vw,46px);margin:4px;background:linear-gradient(90deg,#57e6ff,#a69cff,#ff6bd6);color:transparent;background-clip:text}p.sub{text-align:center;color:#9eacc8;margin:5px 0 22px}.panel{background:#131b31;border:1px solid #293653;border-radius:16px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;justify-content:center}label{display:flex;flex-direction:column;gap:5px;color:#aab8d3;font-size:13px}input,select,button{font:inherit;border:1px solid #344464;background:#0d1426;color:#eef4ff;padding:10px 12px;border-radius:9px}button{cursor:pointer;font-weight:700}button:hover{filter:brightness(1.2)}.primary{background:linear-gradient(90deg,#1686b8,#6d55d9);border:0}.hidden{display:none!important}.status{text-align:center;color:#aab8d3;margin:14px}.status strong{color:#fff}.boardwrap{overflow:auto;max-height:65vh;border:1px solid #293653;border-radius:10px;padding:8px;background:#080d18}#board{display:grid;gap:3px;width:max-content;margin:auto}.cell{width:clamp(28px,4vw,44px);height:clamp(28px,4vw,44px);padding:0;display:grid;place-items:center;font-size:clamp(15px,2.5vw,25px);background:#111a2d;border:1px solid #25334e;border-radius:5px;font-weight:900}.cell.x{color:#57e6ff}.cell.o{color:#ff6bd6}.cell.win{background:#33435b;border-color:#ffe36e}.cell:disabled{cursor:default}.roomline{text-align:center;margin:10px;color:#9eacc8}.roomline b{color:#57e6ff;font-size:20px;letter-spacing:2px}.error{color:#ff9baf;text-align:center;margin:10px}.players{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:#b5c2db;margin:10px}.players strong{color:white}@media(max-width:550px){.panel{padding:11px}.wrap{padding:15px 8px}}
</style></head><body><div class="wrap"><h1>MEGA TIC TAC TOE</h1><p class="sub">Real-time online game for two players</p>
<div class="panel" id="setup"><div class="row">
<label>Your name<input id="name" maxlength="24" placeholder="Player name" value="Player"></label>
<label>Board size<select id="size"><option>10</option><option selected>15</option><option>20</option><option>25</option><option>30</option></select></label>
<label>Connect to win<select id="target"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option></select></label>
<button class="primary" id="create">Create room</button>
</div><hr style="border-color:#293653;margin:16px 0"><div class="row"><label>Room code<input id="code" placeholder="ABC123" maxlength="6"></label><button id="join">Join room</button></div><div class="error" id="error"></div></div>
<div class="panel hidden" id="game"><div class="roomline">ROOM CODE: <b id="roomcode"></b> <button id="copy">Copy code</button></div><div class="players" id="players"></div><div class="status" id="status">Waiting for player 2...</div><div class="row"><button id="restart">Rematch / Reset board</button><button id="leave">Leave room</button></div><div class="boardwrap" style="margin-top:14px"><div id="board"></div></div><div class="status">Scroll horizontally/vertically to access the full board.</div></div>
</div><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let myMark=null,roomState=null;
const $=id=>document.getElementById(id);
function showError(s){$('error').textContent=s||''}
$('create').onclick=()=>{showError('');socket.emit('createRoom',{name:$('name').value,size:+$('size').value,target:+$('target').value})};
$('join').onclick=()=>{showError('');socket.emit('joinRoom',{code:$('code').value,name:$('name').value})};
socket.on('errorMessage',showError);
socket.on('joined',({code,mark})=>{myMark=mark;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('roomcode').textContent=code;});
socket.on('state',state=>{roomState=state;render()});
socket.on('opponentDisconnected',()=>{$('status').textContent='Opponent disconnected. They may reconnect shortly.'});
function render(){if(!roomState)return;const s=roomState;
$('players').innerHTML=s.players.map((p,i)=>p?`<span><strong>${p.name}</strong> (${p.mark}) ${p.mark===myMark?'• You':''}</span>`:`<span>Waiting for player ${i+1}…</span>`).join('');
if(s.winner==='draw')$('status').textContent='Draw! You can reset for a rematch.';
else if(s.winner)$('status').textContent=`${s.winner} wins! ${s.winner===myMark?'You won!':'You lost.'}`;
else if(s.status==='waiting')$('status').textContent='Waiting for player 2 to join…';
else $('status').textContent=`${s.turn===myMark?'Your':'Opponent’s'} turn (${s.turn})`;
const b=$('board');if(b.children.length!==s.board.length){b.innerHTML='';b.style.gridTemplateColumns=`repeat(${s.size},clamp(28px,4vw,44px))`;for(let i=0;i<s.board.length;i++){const btn=document.createElement('button');btn.className='cell';btn.onclick=()=>socket.emit('move',i);b.appendChild(btn)}}
s.board.forEach((v,i)=>{const el=b.children[i];el.textContent=v;el.className='cell'+(v?' '+v.toLowerCase():'')+(s.winningCells.includes(i)?' win':'');el.disabled=!!v||!!s.winner||s.status!=='playing'||s.turn!==myMark});
}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('roomcode').textContent);$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy code',1200)}catch{$('code').value=$('roomcode').textContent}};
$('restart').onclick=()=>socket.emit('restart');$('leave').onclick=()=>location.reload();
</script></body></html>
